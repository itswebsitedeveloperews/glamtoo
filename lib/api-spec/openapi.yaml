openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: storage
    description: Object storage upload and serving operations
  - name: contact
    description: Customer contact enquiries
  - name: seo
    description: Public search metadata and crawler files
paths:
  /admin/gmail:
    get:
      operationId: getAdminGmailSettings
      summary: Read Gmail OAuth setup status (administrators only)
      responses:
        "200":
          description: Setup metadata without mailbox, client credentials or tokens
          content:
            application/json:
              schema:
                type: object
                required: [configured, connected, authMode, callbackUrl, scope, recipientRestricted]
                properties:
                  configured: { type: boolean }
                  connected: { type: boolean }
                  authMode: { type: string, enum: [oauth2] }
                  callbackUrl: { type: [string, "null"] }
                  scope: { type: string }
                  recipientRestricted: { type: boolean }
        "401":
          description: Sign-in required
        "403":
          description: Administrator access required
        "503":
          description: Authorization storage unavailable
  /admin/gmail/connect:
    post:
      operationId: startAdminGmailAuthorization
      summary: Start an administrator-owned Google SMTP authorization
      description: Requires same-origin admin access; sets a Secure HttpOnly SameSite cookie and one-use state. The returned URL includes public OAuth client identification, never the client secret.
      responses:
        "200":
          description: Google consent URL for SMTP scope and offline authorization
          content:
            application/json:
              schema:
                type: object
                required: [authorizationUrl]
                properties:
                  authorizationUrl: { type: string }
        "401":
          description: Sign-in required
        "403":
          description: Administrator or same-origin access required
        "429":
          description: Too many pending authorizations
        "503":
          description: OAuth setup unavailable
  /admin/gmail/verify:
    post:
      operationId: verifyAdminGmailAuthentication
      summary: Verify administrator-configured SMTP authentication without sending
      responses:
        "200":
          description: SMTP authenticated; inbox delivery is not verified
          content:
            application/json:
              schema:
                type: object
                required: [verified, noEmailSent]
                properties:
                  verified: { type: boolean }
                  noEmailSent: { type: boolean }
        "401":
          description: Sign-in required
        "403":
          description: Administrator or same-origin access required
        "503":
          description: Authentication did not pass
  /stripe/payment-intent:
    post:
      operationId: createCheckoutPaymentIntent
      summary: Start an authenticated or guest card payment
      description: Guest payments are owned by an opaque HttpOnly browser cookie, not by the supplied email. Saved payment methods are available only to signed-in customers.
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          description: Required unless retryKey is provided in the body. Reuse for unchanged checkout attempts.
          schema:
            type: string
            minLength: 16
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutPaymentInput"
      responses:
        "200":
          description: A server-priced pending order and Stripe card payment were created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutPaymentIntentResult"
        "400":
          description: Invalid checkout details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Saved card or checkout origin is not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Retry key reused with changed details, completed checkout, or payment recovery required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Shared rate limit, concurrent preparation, or active-reservation limit. Retry the same attempt without requiring sign-in.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Temporary provider failure. Reuse the same retry key; existing allocations remain held until payment is resolved.
  /stripe/finalize-payment:
    post:
      operationId: finalizeCheckoutPayment
      summary: Confirm a paid order owned by the signed-in customer or guest browser
      description: Requires the same guest cookie or authenticated owner that created the payment. Knowing a payment ID or matching an email does not grant access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutPaymentReference"
      responses:
        "200":
          description: Payment verified and application order finalized idempotently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutFinalizationResult"
        "401":
          description: Checkout session missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "400":
          description: Invalid, unpaid, or unowned payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /stripe/checkout:
    post:
      operationId: createHostedCheckout
      summary: Start authenticated or guest hosted Stripe checkout
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          description: Required unless retryKey is supplied in the body. Unchanged retries reuse the owned session.
          schema:
            type: string
            minLength: 16
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutPaymentInput"
      responses:
        "200":
          description: Hosted checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostedCheckoutResult"
        "400":
          description: Invalid checkout details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Checkout details conflict with the retry key or payment recovery is required
        "429":
          description: Shared checkout rate or pending-reservation limit; retry guidance is returned
          headers:
            Retry-After:
              schema:
                type: integer
        "503":
          description: Temporary payment-provider failure; retry with the same key
  /stripe/abandon-payment:
    post:
      operationId: abandonCheckoutPayment
      summary: Cancel an owned pending card payment before retrying
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutPaymentReference"
      responses:
        "200":
          description: Pending payment cancelled
          content:
            application/json:
              schema:
                type: object
                required: [abandoned]
                properties:
                  abandoned:
                    type: boolean
        "401":
          description: Checkout session missing or expired
        "400":
          description: Payment invalid or not owned by this checkout session
        "409":
          description: Payment has already succeeded and must be confirmed instead
  /seo/resolve:
    get:
      tags: [seo]
      operationId: resolveSeo
      summary: Resolve a storefront pathname to canonical SEO metadata
      description: Returns status 200, 301 or 404 inside the JSON body. Redirect locations are local absolute paths. A catalog outage returns HTTP 503, not a fabricated 404.
      parameters:
        - in: query
          name: path
          required: true
          description: Relative storefront pathname, optionally including query parameters.
          schema:
            type: string
            example: /product/sienna-slip-dress?utm_source=email
      responses:
        "200":
          description: Resolved SEO metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeoResolution"
        "400":
          description: Missing or invalid path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Catalog or SEO configuration unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /seo/sitemap.xml:
    get:
      tags: [seo]
      operationId: getSeoSitemap
      summary: Dynamic XML sitemap of indexable storefront pages
      responses:
        "200":
          description: XML sitemap
          content:
            application/xml:
              schema:
                type: string
        "503":
          description: Sitemap unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /seo/robots.txt:
    get:
      tags: [seo]
      operationId: getSeoRobots
      summary: Crawler policy with absolute public sitemap URL
      responses:
        "200":
          description: Text crawler policy
          content:
            text/plain:
              schema:
                type: string
        "503":
          description: SEO configuration unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: A presigned image upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid upload metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Admin sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /contact-enquiries:
    post:
      tags: [contact]
      operationId: submitContactEnquiry
      summary: Send a customer enquiry to the store administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactEnquiryInput"
      responses:
        "200":
          description: Enquiry delivered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactEnquiryResponse"
        "400":
          description: Invalid enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many enquiries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Email delivery is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  schemas:
    CheckoutPaymentInput:
      type: object
      required: [email, customerName, lines, delivery, address]
      properties:
        retryKey:
          type: string
          minLength: 16
          maxLength: 100
          pattern: "^[A-Za-z0-9_-]+$"
          description: Required for checkout creation unless supplied as the Idempotency-Key header. Reuse for unchanged retries; changed details return 409. Busy, rate, or reservation limits return 429 with Retry-After, without requiring sign-in.
        email:
          type: string
        customerName:
          type: string
        phone:
          type: string
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CheckoutPaymentLine"
        delivery:
          type: string
        couponCode:
          type: string
        paymentMethodId:
          type: string
        createAccount:
          type: boolean
          default: false
          description: Create a customer account from billing details only after a successful guest purchase; does not sign the browser in.
        firstName:
          type: string
        lastName:
          type: string
        address:
          $ref: "#/components/schemas/CheckoutPaymentAddress"
    CheckoutPaymentLine:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: string
        variationId:
          type: string
        quantity:
          type: integer
          minimum: 1
    CheckoutPaymentAddress:
      type: object
      required: [line1, city, postcode, country]
      properties:
        line1:
          type: string
        line2:
          type: string
        city:
          type: string
        postcode:
          type: string
        country:
          type: string
          enum: [GB]
    CheckoutPaymentIntentResult:
      type: object
      required: [clientSecret, paymentIntentId]
      properties:
        clientSecret:
          type: string
        paymentIntentId:
          type: string
    HostedCheckoutResult:
      type: object
      required: [url]
      properties:
        url:
          type: string
    CheckoutPaymentReference:
      type: object
      properties:
        paymentIntentId:
          type: string
        checkoutSessionId:
          type: string
    CheckoutFinalizationResult:
      type: object
      required: [finalised, order]
      properties:
        finalised:
          type: boolean
        order:
          type: ["object", "null"]
          additionalProperties: true
    SeoResolution:
      type: object
      required: [status, title, description, canonicalUrl, robots, type]
      properties:
        status:
          type: integer
          enum: [200, 301, 404]
        location:
          type: string
          description: Local absolute redirect pathname (for status 301 only)
        title:
          type: string
        description:
          type: string
        canonicalUrl:
          type: string
          description: Absolute HTTPS URL at the configured SEO_SITE_ORIGIN
        robots:
          type: string
          enum: ["index, follow", "noindex, follow"]
        type:
          type: string
          enum: [website, product]
        image:
          type: string
          description: Absolute product or category image URL when available
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
        size:
          type: number
        contentType:
          type: string
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    ContactEnquiryInput:
      type: object
      required: [name, email, topic, message]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          maxLength: 250
        order:
          type: string
          maxLength: 80
        topic:
          type: string
          enum: [Order help, Delivery, Returns, Product & sizing, Something else]
        message:
          type: string
          minLength: 1
          maxLength: 5000
    ContactEnquiryResponse:
      type: object
      required: [sent, message]
      properties:
        sent:
          type: boolean
        message:
          type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          description: Optional stable error category; checkout distinguishes throttling, conflicts, cancellation, completion and retryable provider failures.

