openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: storage
    description: Object storage upload and serving operations
  - name: contact
    description: Customer contact enquiries
  - name: seo
    description: Public search metadata and crawler files
paths:
  /seo/resolve:
    get:
      tags: [seo]
      operationId: resolveSeo
      summary: Resolve a storefront pathname to canonical SEO metadata
      description: Returns status 200, 301 or 404 inside the JSON body. Redirect locations are local absolute paths. A catalog outage returns HTTP 503, not a fabricated 404.
      parameters:
        - in: query
          name: path
          required: true
          description: Relative storefront pathname, optionally including query parameters.
          schema:
            type: string
            example: /product/sienna-slip-dress?utm_source=email
      responses:
        "200":
          description: Resolved SEO metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeoResolution"
        "400":
          description: Missing or invalid path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Catalog or SEO configuration unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /seo/sitemap.xml:
    get:
      tags: [seo]
      operationId: getSeoSitemap
      summary: Dynamic XML sitemap of indexable storefront pages
      responses:
        "200":
          description: XML sitemap
          content:
            application/xml:
              schema:
                type: string
        "503":
          description: Sitemap unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /seo/robots.txt:
    get:
      tags: [seo]
      operationId: getSeoRobots
      summary: Crawler policy with absolute public sitemap URL
      responses:
        "200":
          description: Text crawler policy
          content:
            text/plain:
              schema:
                type: string
        "503":
          description: SEO configuration unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: A presigned image upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid upload metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Admin sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /contact-enquiries:
    post:
      tags: [contact]
      operationId: submitContactEnquiry
      summary: Send a customer enquiry to the store administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactEnquiryInput"
      responses:
        "200":
          description: Enquiry delivered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactEnquiryResponse"
        "400":
          description: Invalid enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many enquiries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Email delivery is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  schemas:
    SeoResolution:
      type: object
      required: [status, title, description, canonicalUrl, robots, type]
      properties:
        status:
          type: integer
          enum: [200, 301, 404]
        location:
          type: string
          description: Local absolute redirect pathname (for status 301 only)
        title:
          type: string
        description:
          type: string
        canonicalUrl:
          type: string
          description: Absolute HTTPS URL at the configured SEO_SITE_ORIGIN
        robots:
          type: string
          enum: ["index, follow", "noindex, follow"]
        type:
          type: string
          enum: [website, product]
        image:
          type: string
          description: Absolute product or category image URL when available
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
        size:
          type: number
        contentType:
          type: string
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    ContactEnquiryInput:
      type: object
      required: [name, email, topic, message]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          maxLength: 250
        order:
          type: string
          maxLength: 80
        topic:
          type: string
          enum: [Order help, Delivery, Returns, Product & sizing, Something else]
        message:
          type: string
          minLength: 1
          maxLength: 5000
    ContactEnquiryResponse:
      type: object
      required: [sent, message]
      properties:
        sent:
          type: boolean
        message:
          type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

