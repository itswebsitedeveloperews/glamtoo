kind = "web"
previewPath = "/"
title = "Glam Too"
description = "Glam Too Boutique storefront with server-resolved SEO metadata, stable catalog URLs, redirects, and a dynamic sitemap."
version = "1.0.0"
id = "artifacts/glam-me"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18781

[services.development]
run = "pnpm --filter @workspace/glam-me run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/glam-me", "run", "build" ]

[services.production.run]
args = [ "node", "artifacts/glam-me/server/index.mjs" ]

[services.production.run.env]
PORT = "18781"
NODE_ENV = "production"

[services.production.health.startup]
path = "/__health"

[services.env]
PORT = "18781"
BASE_PATH = "/"